apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-assessment
  namespace: platform-assessment
  labels:
    app.kubernetes.io/name: platform-assessment
    app.kubernetes.io/instance: platform-assessment
    app.kubernetes.io/component: api
spec:
  replicas: 2
  minReadySeconds: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-assessment
      app.kubernetes.io/instance: platform-assessment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-assessment
        app.kubernetes.io/instance: platform-assessment
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: platform-assessment
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: platform-assessment
              app.kubernetes.io/instance: platform-assessment
      terminationGracePeriodSeconds: 30
      containers:
        - name: platform-assessment
          image: registry.example.invalid/platform-assessment:REPLACE_WITH_GIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 4
            successThreshold: 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
