name: Continuous Integration

"on":
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: platform-assessment
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.15.9"
  TRIVY_VERSION: "v0.74.0"

jobs:
  quality-and-test:
    name: Quality, tests, and repository security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install runtime and development dependencies
        run: |
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Lint with Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m pytest

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Scan tracked repository inputs for vulnerabilities and secrets
        run: |
          trivy filesystem \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format table \
            --skip-dirs .git \
            --skip-dirs .venv \
            --skip-dirs .venv312 \
            --skip-dirs reference \
            --skip-dirs infra/.terraform \
            --skip-files '**/*.tfstate*' \
            --skip-files '**/*.tfvars' \
            --skip-files '**/*.tfvars.json' \
            --skip-files '**/*.tfplan' \
            --skip-files '**/*.plan' \
            .

  terraform-validation:
    name: Terraform formatting and validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Terraform without a backend
        run: terraform -chdir=infra init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=infra validate -no-color

  build-scan-and-runtime-test:
    name: Build, scan, and hardened runtime test
    needs:
      - quality-and-test
      - terraform-validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONTAINER_NAME: phase3a-runtime-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build exact commit image without pushing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=phase3a-linux-amd64
          cache-to: type=gha,mode=max,scope=phase3a-linux-amd64

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      - name: Block High and Critical image vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            --format table \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Start the exact image with hardened runtime controls
        run: |
          docker run --detach \
            --name "${CONTAINER_NAME}" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --publish 127.0.0.1:18080:8080 \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Wait for Docker health with a bounded retry
        run: |
          health_status=starting
          for attempt in $(seq 1 40); do
            health_status="$(docker inspect \
              --format '{{.State.Health.Status}}' \
              "${CONTAINER_NAME}")"
            if [ "${health_status}" = healthy ]; then
              break
            fi
            if [ "${health_status}" = unhealthy ]; then
              docker logs "${CONTAINER_NAME}"
              exit 1
            fi
            sleep 2
          done
          if [ "${health_status}" != healthy ]; then
            docker logs "${CONTAINER_NAME}"
            exit 1
          fi

      - name: Validate health response and non-root identity
        run: |
          response_file="${RUNNER_TEMP}/health-response.json"
          http_status="$(curl \
            --silent \
            --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            http://127.0.0.1:18080/health)"
          test "${http_status}" = 200
          test "$(cat "${response_file}")" = '{"status":"healthy"}'

          runtime_identity="$(docker exec "${CONTAINER_NAME}" id -u):$(
            docker exec "${CONTAINER_NAME}" id -g
          )"
          test "${runtime_identity}" = 10001:10001
          test "$(docker inspect \
            --format '{{.State.Health.Status}}' \
            "${CONTAINER_NAME}")" = healthy

      - name: Clean up runtime container
        if: ${{ always() }}
        run: docker rm --force "${CONTAINER_NAME}" 2>/dev/null || true
